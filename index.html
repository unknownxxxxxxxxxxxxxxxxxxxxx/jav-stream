<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavStream</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #15161c;
            --accent-color: #e50914;
            --text-main: #ffffff;
            --text-muted: #8c8f96;
            --border-color: #22252a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            padding: 14px 24px;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 20px;
            font-weight: 800;
            color: var(--text-main);
            text-decoration: none;
            letter-spacing: 0.5px;
        }

        .logo span {
            color: var(--accent-color);
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 6px 12px;
            width: 180px;
            transition: width 0.3s ease, border-color 0.2s;
        }

        @media (min-width: 768px) {
            .search-box {
                width: 240px;
            }
        }

        .search-box:focus-within {
            border-color: var(--accent-color);
        }

        .search-input {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 13px;
            outline: none;
            width: 100%;
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .menu-container {
            position: relative;
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            right: 0;
            top: 48px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            width: 200px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            z-index: 1001;
        }

        .dropdown-menu.show {
            display: block;
        }

        .dropdown-item {
            display: block;
            padding: 12px 16px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            border-bottom: 1px solid var(--border-color);
            transition: background 0.2s, color 0.2s;
        }

        .dropdown-item:last-child {
            border-bottom: none;
        }

        .dropdown-item:hover {
            background: rgba(229, 9, 20, 0.1);
            color: var(--accent-color);
        }

        .container {
            max-width: 1200px;
            margin: 32px auto;
            padding: 0 24px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 24px;
            color: var(--text-muted);
            border-left: 3px solid var(--accent-color);
            padding-left: 12px;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }

        .video-card {
            background: var(--card-bg);
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .video-card:hover {
            transform: translateY(-2px);
            border-color: #3a3f4b;
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background: #000;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .video-info {
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .video-meta {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .video-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: 0.5px;
        }

        .video-actress {
            font-size: 12px;
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
        }

        .video-actress:hover {
            color: var(--accent-color);
        }

        .video-badge {
            font-size: 10px;
            text-transform: uppercase;
            background: rgba(229, 9, 20, 0.15);
            color: var(--accent-color);
            padding: 3px 8px;
            border-radius: 3px;
            font-weight: 700;
            letter-spacing: 0.5px;
            height: fit-content;
        }
    </style>
</head>
<body>

    <header class="navbar">
        <a href="#" class="logo">Jav<span>Stream</span></a>
        <div class="nav-right">
            <div class="search-box">
                <input type="text" class="search-input" placeholder="Search archive..." id="searchInput" onkeypress="handleSearchKey(event)">
                <button class="icon-btn" onclick="triggerSearch()" style="font-size: 12px;">Search</button>
            </div>

            <div class="menu-container">
                <button class="icon-btn" onclick="toggleMenu()" aria-label="Navigation Menu">Menu</button>
                <div class="dropdown-menu" id="dropdownMenu">
                    <a href="#" class="dropdown-item">Home</a>
                    <a href="actress/" class="dropdown-item">Actress</a>
                    <a href="#" class="dropdown-item">Categories</a>
                    <a href="#" class="dropdown-item">System Archive</a>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <h2 class="section-title">Latest Releases</h2>
        
        <div class="video-grid">
            <div class="video-card">
                <div class="video-container">
                    <iframe src="https://luluvido.com/e/13jr1kyhz6m7" allowfullscreen></iframe>
                </div>
                <div class="video-info">
                    <div class="video-meta">
                        <div class="video-title">JUR-655</div>
                        <a href="actress/" class="video-actress">Minamisawa Umika</a>
                    </div>
                    <span class="video-badge">HD</span>
                </div>
            </div>
        </div>
    </main>

    <script>
        function toggleMenu() {
            let menu = document.getElementById('dropdownMenu');
            menu.classList.toggle('show');
        }

        window.onclick = function(event) {
            if (!event.target.matches('.icon-btn')) {
                let dropdowns = document.getElementsByClassName("dropdown-menu");
                for (let i = 0; i < dropdowns.length; i++) {
                    let openDropdown = dropdowns[i];
                    if (openDropdown.classList.contains('show')) {
                        openDropdown.classList.remove('show');
                    }
                }
            }
        }

        function stopHiddenVideos() {
            let cards = document.getElementsByClassName('video-card');
            for (let i = 0; i < cards.length; i++) {
                if (cards[i].style.display === "none") {
                    let iframe = cards[i].querySelector('iframe');
                    if (iframe) {
                        let currentSrc = iframe.src;
                        iframe.src = '';
                        iframe.src = currentSrc;
                    }
                }
            }
        }

        function triggerSearch() {
            let inputVal = document.getElementById('searchInput').value;
            let query = inputVal.toLowerCase().trim();
            let cards = document.getElementsByClassName('video-card');
            let grid = document.querySelector('.video-grid');
            let foundCount = 0;

            for (let i = 0; i < cards.length; i++) {
                let title = cards[i].getElementsByClassName('video-title')[0].innerText.toLowerCase();
                let actress = cards[i].getElementsByClassName('video-actress')[0].innerText.toLowerCase();
                
                // Pencarian sekarang juga mendeteksi nama aktris selain kode video!
                if (title.includes(query) || actress.includes(query)) {
                    cards[i].style.display = "";
                    foundCount++;
                } else {
                    cards[i].style.display = "none";
                }
            }

            stopHiddenVideos();

            let notFoundMsg = document.getElementById('noResultMsg');
            if (foundCount === 0) {
                if (!notFoundMsg) {
                    notFoundMsg = document.createElement('div');
                    notFoundMsg.id = 'noResultMsg';
                    notFoundMsg.style.cssText = 'grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--text-muted); font-size: 14px;';
                    grid.appendChild(notFoundMsg);
                }
                notFoundMsg.innerText = 'No results found for "' + inputVal + '"';
                notFoundMsg.style.display = 'block';
            } else {
                if (notFoundMsg) {
                    notFoundMsg.style.display = 'none';
                }
            }
        }

        function handleSearchKey(e) {
            if (e.key === 'Enter') {
                triggerSearch();
            }
        }

        document.getElementById('searchInput').addEventListener('input', function() {
            if (this.value === '') {
                triggerSearch();
            }
        });
    </script>

</body>
</html>
