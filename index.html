<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavStream</title>
    <style>
        :root {
            --bg-color: #0f1015;
            --card-bg: #181920;
            --accent-color: #e50914;
            --text-main: #ffffff;
            --text-muted: #a0a0a5;
            --border-color: #2a2b36;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
        }

        /* Navbar Profesional */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            padding: 14px 24px;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 20px;
            font-weight: 800;
            color: var(--text-main);
            text-decoration: none;
            letter-spacing: 0.5px;
        }

        .logo span {
            color: var(--accent-color);
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: #0f1015;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 6px 14px;
            width: 180px;
            transition: width 0.3s ease;
        }

        .search-box:focus-within {
            width: 240px;
            border-color: var(--accent-color);
        }

        .search-input {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 13px;
            outline: none;
            width: 100%;
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 18px;
            cursor: pointer;
            padding: 4px;
        }

        /* Container & Grid Arsip Video */
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            border-left: 4px solid var(--accent-color);
            padding-left: 10px;
            color: var(--text-main);
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }

        .video-card {
            background: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .video-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* Aspect Ratio 16:9 */
            background: #000;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .video-info {
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .video-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: 0.5px;
        }

        .video-badge {
            font-size: 11px;
            background: rgba(229, 9, 20, 0.15);
            color: var(--accent-color);
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: 600;
        }

        /* Responsive untuk HP kecil */
        @media (max-width: 480px) {
            .search-box {
                display: none; /* Sembunyikan search bar kecil di mobile, pakai tombol */
            }
            .navbar {
                padding: 12px 16px;
            }
        }
    </style>
</head>
<body>

    <!-- Navbar Utama -->
    <header class="navbar">
        <a href="#" class="logo">Jav<span>Stream</span></a>
        <div class="nav-right">
            <div class="search-box">
                <input type="text" class="search-input" placeholder="Cari kode/aktris..." id="searchInput" onkeypress="handleSearchKey(event)">
                <span style="font-size: 14px; cursor: pointer;" onclick="triggerSearch()">🔍</span>
            </div>
            <button class="icon-btn" onclick="toggleMenu()" title="Menu">☰</button>
        </div>
    </header>

    <!-- Konten Utama -->
    <main class="container">
        <h2 class="section-title">Katalog Terbaru</h2>
        
        <div class="video-grid">
            <!-- Kartu Video 1 -->
            <div class="video-card">
                <div class="video-container">
                    <iframe src="https://luluvido.com/e/13jr1kyhz6m7" allowfullscreen></iframe>
                </div>
                <div class="video-info">
                    <div class="video-title">JUR-655</div>
                    <span class="video-badge">HD</span>
                </div>
            </div>
            
            <!-- (Contoh slot video berikutnya bisa ditambahkan di sini dengan struktur yang sama) -->
        </div>
    </main>

    <!-- Skrip Interaktif Standar -->
    <script>
        function triggerSearch() {
            let query = document.getElementById('searchInput').value;
            if(query) {
                alert("Mencari arsip untuk: " + query);
            } else {
                alert("Silakan ketik kode atau nama aktris yang ingin dicari.");
            }
        }

        function handleSearchKey(e) {
            if (e.key === 'Enter') {
                triggerSearch();
            }
        }

        function toggleMenu() {
            alert("Menu Navigasi:\n• Beranda\n• Daftar Aktris\n• Kategori Studio\n• Arsip Koleksi");
        }
    </script>

</body>
</html>
