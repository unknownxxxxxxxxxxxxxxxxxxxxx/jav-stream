<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Title & SEO Meta Tags -->
    <title>JavStream HD - Watch Free JAV Stream Online</title>
    <meta name="description" content="Watch high quality JAV streaming videos online on JavStream HD. Explore latest releases and actress archives.">
    <meta name="keywords" content="jav, javstream, jav stream, javstreamhd, streaming jav">
    
    <!-- Google Site Verification -->
    <meta name="google-site-verification" content="WKsgCWA9Sjz-bw_bkkrmzkVkt-CaIXmNXbR2FbcE-3M" />

    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #15161c;
            --accent-color: #e50914;
            --text-main: #ffffff;
            --text-muted: #8c8f96;
            --border-color: #22252a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            padding: 14px 24px;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 20px;
            font-weight: 800;
            color: var(--text-main);
            text-decoration: none;
            letter-spacing: 0.5px;
        }

        .logo span {
            color: var(--accent-color);
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 6px 12px;
            width: 180px;
            transition: width 0.3s ease, border-color 0.2s;
        }

        @media (min-width: 768px) {
            .search-box {
                width: 240px;
            }
        }

        .search-box:focus-within {
            border-color: var(--accent-color);
        }

        .search-input {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 13px;
            outline: none;
            width: 100%;
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .menu-container {
            position: relative;
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            right: 0;
            top: 48px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            width: 180px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            z-index: 1001;
        }

        .dropdown-menu.show {
            display: block;
        }

        .dropdown-item-primary {
            display: block;
            padding: 12px 16px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            background: rgba(229, 9, 20, 0.15);
            border-left: 3px solid var(--accent-color);
            transition: background 0.2s;
        }

        .dropdown-item-primary:hover {
            background: rgba(229, 9, 20, 0.25);
            color: var(--accent-color);
        }

        .dropdown-divider {
            height: 1px;
            background: var(--border-color);
            margin: 4px 0;
        }

        .dropdown-item-secondary {
            display: block;
            padding: 8px 16px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 11px;
            transition: color 0.2s, background 0.2s;
        }

        .dropdown-item-secondary:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.03);
        }

        .container {
            max-width: 1200px;
            margin: 32px auto;
            padding: 0 24px;
            flex: 1;
            width: 100%;
        }

        .adblock-notice {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--accent-color);
            border-radius: 6px;
            padding: 12px 18px;
            margin-bottom: 28px;
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .adblock-notice strong {
            color: var(--text-main);
        }

        .adblock-notice .highlight {
            color: var(--accent-color);
            font-weight: 600;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 24px;
            color: var(--text-muted);
            border-left: 3px solid var(--accent-color);
            padding-left: 12px;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }

        .video-card {
            background: var(--card-bg);
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .video-card:hover {
            transform: translateY(-2px);
            border-color: #3a3f4b;
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background: #000;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .video-info {
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .video-meta {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .video-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: 0.5px;
        }

        .video-actress {
            font-size: 12px;
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
        }

        .video-actress:hover {
            color: var(--accent-color);
        }

        .video-right-side {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
        }

        .video-badge {
            font-size: 10px;
            text-transform: uppercase;
            background: rgba(229, 9, 20, 0.15);
            color: var(--accent-color);
            padding: 3px 8px;
            border-radius: 3px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .report-btn {
            font-size: 10px;
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
        }

        .report-btn:hover {
            color: var(--accent-color);
            text-decoration: underline;
        }

        .site-footer {
            text-align: center;
            padding: 30px 24px;
            border-top: 1px solid var(--border-color);
            margin-top: auto;
            color: var(--text-muted);
            font-size: 13px;
        }
    </style>
</head>
<body>

    <header class="navbar">
        <a href="/" class="logo">Jav<span>Stream</span></a>
        <div class="nav-right">
            <div class="search-box">
                <input type="text" class="search-input" placeholder="Search archive..." id="searchInput" oninput="triggerSearch()">
            </div>

            <div class="menu-container">
                <button class="icon-btn" onclick="toggleMenu()" aria-label="Navigation Menu">Menu</button>
                <div class="dropdown-menu" id="dropdownMenu">
                    <a href="actress/" class="dropdown-item-primary">Actress</a>
                    <div class="dropdown-divider"></div>
                    <a href="disclaimer.html" class="dropdown-item-secondary">Disclaimer & DMCA</a>
                    <a href="privacy.html" class="dropdown-item-secondary">Privacy Policy</a>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- Friendly Reminder Banner for Ad-Blocker -->
        <div class="adblock-notice">
            💡 <strong>Tip for the Best Experience:</strong> For smooth, fast, and interruption-free playback, we highly recommend using an ad-blocker extension such as <span class="highlight">uBlock Origin</span> on your browser.
        </div>

        <h2 class="section-title">Latest Releases</h2>
        
        <div class="video-grid" id="mainVideoGrid">
            <!-- Video dimuat secara dinamis via JavaScript -->
        </div>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 JavStream HD. All rights reserved.</p>
    </footer>

    <script>
        // Database terpusat beranda (Tanpa atribut date)
        const database = [
            {
                code: "JUR-683",
                actress: "Minamisawa Umika",
                actressSlug: "minamisawa-umika",
                embedUrl: "https://luluvido.com/e/a68tcurf645r",
                badge: "HD"
            },
            {
                code: "JUR-655",
                actress: "Minamisawa Umika",
                actressSlug: "minamisawa-umika",
                embedUrl: "https://luluvido.com/e/13jr1kyhz6m7",
                badge: "HD"
            },
            {
                code: "JUR-064",
                actress: "Minamisawa Umika",
                actressSlug: "minamisawa-umika",
                embedUrl: "https://luluvido.com/e/413cododyut4",
                badge: "HD"
            }
        ];

        function toggleMenu() {
            let menu = document.getElementById('dropdownMenu');
            menu.classList.toggle('show');
        }

        window.onclick = function(event) {
            if (!event.target.matches('.icon-btn')) {
                let dropdowns = document.getElementsByClassName("dropdown-menu");
                for (let i = 0; i < dropdowns.length; i++) {
                    let openDropdown = dropdowns[i];
                    if (openDropdown.classList.contains('show')) {
                        openDropdown.classList.remove('show');
                    }
                }
            }
        }

        function renderVideos(videosToRender) {
            const grid = document.getElementById('mainVideoGrid');
            if (videosToRender.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--text-muted); font-size: 14px;">No releases found matching your search.</div>';
                return;
            }

            let html = '';
            videosToRender.forEach(video => {
                html += `
                    <div class="video-card">
                        <div class="video-container">
                            <iframe src="${video.embedUrl}" allowfullscreen></iframe>
                        </div>
                        <div class="video-info">
                            <div class="video-meta">
                                <div class="video-title">${video.code}</div>
                                <a href="actress/?name=${video.actressSlug}" class="video-actress">${video.actress}</a>
                            </div>
                            <div class="video-right-side">
                                <span class="video-badge">${video.badge}</span>
                                <a href="https://forms.gle/g8xnq1XmNwTG1xYR6" target="_blank" class="report-btn">Report Broken</a>
                            </div>
                        </div>
                    </div>
                `;
            });
            grid.innerHTML = html;
        }

        function triggerSearch() {
            let query = document.getElementById('searchInput').value.toLowerCase().trim();
            let filtered = database.filter(item => 
                item.code.toLowerCase().includes(query) || 
                item.actress.toLowerCase().includes(query)
            );
            renderVideos(filtered);
        }

        // Render otomatis video saat halaman dimuat
        window.onload = function() {
            renderVideos(database);
        };
    </script>

</body>
</html>
