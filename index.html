<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavStream</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #0d0d0d;
            color: #ffffff;
        }

        /* Header / Navbar Style */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #18181c;
            padding: 12px 20px;
            border-bottom: 1px solid #2a2a30;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #ffffff;
            text-decoration: none;
        }
        .logo span {
            color: #e50914; /* Akses warna merah */
        }
        .nav-icons {
            display: flex;
            gap: 18px;
            align-items: center;
        }
        .icon-btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 20px;
            cursor: pointer;
        }

        /* Content Container */
        .container {
            max-width: 1000px;
            margin: 20px auto;
            padding: 0 15px;
        }

        /* Video Grid Style */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .video-card {
            background: #18181c;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #2a2a30;
        }
        .video-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* Ratio 16:9 */
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        .video-info {
            padding: 12px;
            text-align: center;
        }
        .video-title {
            font-size: 15px;
            font-weight: bold;
            color: #e0e0e0;
        }
    </style>
</head>
<body>

    <!-- Header / Navbar mirip Jav.Guru -->
    <header class="navbar">
        <a href="#" class="logo">Jav<span>Stream</span></a>
        <div class="nav-icons">
            <button class="icon-btn" title="Search">🔍</button>
            <button class="icon-btn" title="Menu">☰</button>
        </div>
    </header>

    <!-- Main Content Grid -->
    <main class="container">
        <div class="video-grid">
            <div class="video-card">
                <div class="video-container">
                    <iframe src="https://luluvido.com/e/13jr1kyhz6m7" allowfullscreen></iframe>
                </div>
                <div class="video-info">
                    <div class="video-title">JUR-655</div>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
