<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Title & SEO Meta Tags -->
    <title>Actress Directory - JavStream HD</title>
    <meta name="description" content="Explore actress archives and associated high quality JAV streaming releases on JavStream HD.">
    <meta name="keywords" content="jav actress, javstream, javstreamhd, streaming jav actress">
    
    <!-- Google Site Verification -->
    <meta name="google-site-verification" content="WKsgCWA9Sjz-bw_bkkrmzkVkt-CaIXmNXbR2FbcE-3M" />

    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #15161c;
            --accent-color: #e50914;
            --text-main: #ffffff;
            --text-muted: #8c8f96;
            --border-color: #22252a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            padding: 14px 24px;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 20px;
            font-weight: 800;
            color: var(--text-main);
            text-decoration: none;
            letter-spacing: 0.5px;
        }

        .logo span {
            color: var(--accent-color);
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 6px 12px;
            width: 180px;
            transition: width 0.3s ease, border-color 0.2s;
        }

        @media (min-width: 768px) {
            .search-box {
                width: 240px;
            }
        }

        .search-box:focus-within {
            border-color: var(--accent-color);
        }

        .search-input {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 13px;
            outline: none;
            width: 100%;
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .container {
            max-width: 1200px;
            margin: 32px auto;
            padding: 0 24px;
        }

        .profile-header {
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        @media (min-width: 768px) {
            .profile-header {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
        }

        .profile-header-left {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .profile-name {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
            text-transform: capitalize;
        }

        .video-count-badge {
            font-size: 12px;
            color: var(--text-muted);
        }

        .profile-header-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .filter-select {
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 13px;
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .filter-select:focus {
            border-color: var(--accent-color);
        }

        .az-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 28px;
            background: var(--card-bg);
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            justify-content: center;
        }

        .az-btn {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }

        .az-btn:hover, .az-btn.active {
            background: var(--accent-color);
            color: var(--text-main);
            border-color: var(--accent-color);
        }

        .alphabet-section {
            margin-bottom: 32px;
        }

        .alphabet-heading {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-main);
            border-left: 3px solid var(--accent-color);
            padding-left: 12px;
            margin-bottom: 16px;
            letter-spacing: 1px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }

        .actress-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 20px;
            text-decoration: none;
            color: var(--text-main);
            transition: transform 0.2s ease, border-color 0.2s ease;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .actress-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent-color);
        }

        .actress-card-name {
            font-size: 16px;
            font-weight: 600;
        }

        .actress-card-count {
            font-size: 12px;
            color: var(--text-muted);
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }

        .video-card {
            background: var(--card-bg);
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .video-card:hover {
            transform: translateY(-2px);
            border-color: #3a3f4b;
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background: #000;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .video-info {
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .video-meta {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .video-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: 0.5px;
        }

        .video-actress {
            font-size: 12px;
            color: var(--text-muted);
        }

        .video-badge {
            font-size: 10px;
            text-transform: uppercase;
            background: rgba(229, 9, 20, 0.15);
            color: var(--accent-color);
            padding: 3px 8px;
            border-radius: 3px;
            font-weight: 700;
            letter-spacing: 0.5px;
            height: fit-content;
        }
    </style>
</head>
<body>

    <header class="navbar">
        <a href="../" class="logo">Jav<span>Stream</span></a>
        <div class="nav-right">
            <div class="search-box" id="searchBoxContainer" style="display: none;">
                <input type="text" class="search-input" placeholder="Search actress..." id="actressSearchInput" oninput="filterActresses()">
            </div>
        </div>
    </header>

    <main class="container">
        <div class="profile-header">
            <div class="profile-header-left">
                <h1 class="profile-name" id="pageTitle">Actress Directory</h1>
                <div class="video-count-badge" id="videoCountBadge" style="display: none;">0 Videos Available</div>
            </div>
            
            <div class="profile-header-right">
                <select class="filter-select" id="sortSelect" style="display: none;" onchange="sortActressVideos()">
                    <option value="az">Title (A-Z)</option>
                    <option value="za">Title (Z-A)</option>
                </select>

                <div class="search-box" id="videoSearchBoxContainer" style="display: none; width: 100%; max-width: 260px;">
                    <input type="text" class="search-input" placeholder="Search releases..." id="videoSearchInput" oninput="filterActressVideos()">
                </div>
            </div>
        </div>

        <div id="contentSection">
            <!-- Konten dinamis -->
        </div>
    </main>

    <script>
        // Database terpusat (Tanpa atribut date)
        const database = [
            {
                code: "JUR-683",
                actress: "Minamisawa Umika",
                actressSlug: "minamisawa-umika",
                embedUrl: "https://luluvido.com/e/a68tcurf645r",
                badge: "HD"
            },
            {
                code: "JUR-655",
                actress: "Minamisawa Umika",
                actressSlug: "minamisawa-umika",
                embedUrl: "https://luluvido.com/e/13jr1kyhz6m7",
                badge: "HD"
            }
        ];

        const urlParams = new URLSearchParams(window.location.search);
        let querySlug = urlParams.get('name') || '';
        querySlug = querySlug.toLowerCase().trim();

        let pageTitle = document.getElementById('pageTitle');
        let videoCountBadge = document.getElementById('videoCountBadge');
        let contentSection = document.getElementById('contentSection');
        let searchBoxContainer = document.getElementById('searchBoxContainer');
        let videoSearchBoxContainer = document.getElementById('videoSearchBoxContainer');
        let sortSelect = document.getElementById('sortSelect');

        if (querySlug) {
            let matchedVideos = database.filter(item => item.actressSlug === querySlug);
            
            if (matchedVideos.length > 0) {
                pageTitle.innerText = matchedVideos[0].actress;
                document.title = matchedVideos[0].actress + " - Actress Directory - JavStream";
                
                videoCountBadge.style.display = "block";
                videoSearchBoxContainer.style.display = "flex";
                sortSelect.style.display = "block";

                window.currentActressVideos = matchedVideos;
                sortActressVideos();
            } else {
                pageTitle.innerText = "Actress Not Found";
                contentSection.innerHTML = '<div style="text-align: center; padding: 40px; color: var(--text-muted); font-size: 14px;">No archive records found for this profile.</div>';
            }
        } else {
            pageTitle.innerText = "Actress Directory";
            searchBoxContainer.style.display = "flex";

            let actressMap = {};
            database.forEach(item => {
                if (!actressMap[item.actressSlug]) {
                    actressMap[item.actressSlug] = {
                        name: item.actress,
                        slug: item.actressSlug,
                        count: 0
                    };
                }
                actressMap[item.actressSlug].count++;
            });

            window.actressList = Object.values(actressMap);
            renderDirectoryView(window.actressList);
        }

        function renderDirectoryView(actresses) {
            let html = '';

            let letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
            html += '<div class="az-bar">';
            html += '<button class="az-btn active" onclick="filterByLetter(\'ALL\', this)">ALL</button>';
            letters.forEach(letter => {
                html += `<button class="az-btn" onclick="filterByLetter('${letter}', this)">${letter}</button>`;
            });
            html += '</div>';

            html += '<div id="alphabetGroupsContainer">';
            html += generateAlphabetGroupsHtml(actresses);
            html += '</div>';

            contentSection.innerHTML = html;
        }

        function generateAlphabetGroupsHtml(actresses) {
            if (actresses.length === 0) {
                return '<div style="text-align: center; padding: 40px; color: var(--text-muted); font-size: 14px;">No actress profiles found.</div>';
            }

            let groups = {};
            actresses.forEach(actress => {
                let firstChar = actress.name.charAt(0).toUpperCase();
                if (!/[A-Z]/.test(firstChar)) {
                    firstChar = '#';
                }
                if (!groups[firstChar]) {
                    groups[firstChar] = [];
                }
                groups[firstChar].push(actress);
            });

            let sortedKeys = Object.keys(groups).sort((a, b) => {
                if (a === '#') return 1;
                if (b === '#') return -1;
                return a.localeCompare(b);
            });

            let html = '';
            sortedKeys.forEach(letter => {
                html += `
                    <div class="alphabet-section" data-letter="${letter}">
                        <div class="alphabet-heading">${letter}</div>
                        <div class="grid">
                `;
                groups[letter].forEach(actress => {
                    html += `
                        <a href="?name=${actress.slug}" class="actress-card">
                            <div class="actress-card-name">${actress.name}</div>
                            <div class="actress-card-count">${actress.count} Release${actress.count > 1 ? 's' : ''}</div>
                        </a>
                    `;
                });
                html += `</div></div>`;
            });

            return html;
        }

        function filterByLetter(letter, btnElement) {
            let buttons = document.querySelectorAll('.az-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            let sections = document.querySelectorAll('.alphabet-section');
            sections.forEach(section => {
                let secLetter = section.getAttribute('data-letter');
                if (letter === 'ALL' || secLetter === letter) {
                    section.style.display = 'block';
                } else {
                    section.style.display = 'none';
                }
            });
        }

        function renderVideoGrid(videos) {
            let html = '<div class="video-grid" id="videoGridContainer">';
            videos.forEach(video => {
                html += `
                    <div class="video-card">
                        <div class="video-container">
                            <iframe src="${video.embedUrl}" allowfullscreen></iframe>
                        </div>
                        <div class="video-info">
                            <div class="video-meta">
                                <div class="video-title">${video.code}</div>
                                <div class="video-actress">${video.actress}</div>
                            </div>
                            <span class="video-badge">${video.badge}</span>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            contentSection.innerHTML = html;
        }

        function filterActresses() {
            let query = document.getElementById('actressSearchInput').value.toLowerCase().trim();
            let filtered = window.actressList.filter(a => a.name.toLowerCase().includes(query));
            
            let container = document.getElementById('alphabetGroupsContainer');
            if (container) {
                container.innerHTML = generateAlphabetGroupsHtml(filtered);
            }
        }

        function sortActressVideos() {
            if (!window.currentActressVideos) return;

            let query = document.getElementById('videoSearchInput').value.toLowerCase().trim();
            let sortMethod = document.getElementById('sortSelect').value;

            let filtered = window.currentActressVideos.filter(video => 
                video.code.toLowerCase().includes(query)
            );

            if (sortMethod === 'az') {
                filtered.sort((a, b) => a.code.localeCompare(b.code));
            } else if (sortMethod === 'za') {
                filtered.sort((a, b) => b.code.localeCompare(a.code));
            }

            let totalCount = window.currentActressVideos.length;
            videoCountBadge.innerText = totalCount + (totalCount === 1 ? " Video Available" : " Videos Available");

            let container = document.getElementById('contentSection');
            if (filtered.length === 0) {
                container.innerHTML = '<div style="text-align: center; padding: 40px; color: var(--text-muted); font-size: 14px;">No releases found matching your search.</div>';
                return;
            }

            renderVideoGrid(filtered);
        }

        function filterActressVideos() {
            sortActressVideos();
        }
    </script>

</body>
</html>
