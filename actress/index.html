<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actresses Directory - JavStream</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #15161c;
            --accent-color: #e50914;
            --text-main: #ffffff;
            --text-muted: #8c8f96;
            --border-color: #22252a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            padding: 14px 24px;
            border-bottom: 1px solid var(--border-color);
        }
        .logo {
            font-size: 20px;
            font-weight: 800;
            color: var(--text-main);
            text-decoration: none;
            letter-spacing: 0.5px;
        }
        .logo span { color: var(--accent-color); }
        .container {
            max-width: 1000px;
            margin: 60px auto;
            padding: 0 24px;
            text-align: center;
        }
        .title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-main);
        }
        p { color: var(--text-muted); margin-bottom: 30px; font-size: 14px; }
        .back-btn {
            display: inline-block;
            background: var(--card-bg);
            color: var(--text-main);
            padding: 10px 24px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: background 0.2s, border-color 0.2s;
        }
        .back-btn:hover {
            background: rgba(229, 9, 20, 0.1);
            color: var(--accent-color);
            border-color: var(--accent-color);
        }
    </style>
</head>
<body>

    <header class="navbar">
        <a href="../" class="logo">Jav<span>Stream</span></a>
    </header>

    <main class="container">
        <h1 class="title">Actresses Directory</h1>
        <p>Database and catalog indices are currently under preparation.</p>
        <div>
            <a href="../" class="back-btn">Return to Home</a>
        </div>
    </main>

</body>
</html>
