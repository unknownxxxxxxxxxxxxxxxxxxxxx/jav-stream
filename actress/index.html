<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minamisawa Umika - Actress Directory - JavStream</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #15161c;
            --accent-color: #e50914;
            --text-main: #ffffff;
            --text-muted: #8c8f96;
            --border-color: #22252a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            padding: 14px 24px;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 20px;
            font-weight: 800;
            color: var(--text-main);
            text-decoration: none;
            letter-spacing: 0.5px;
        }

        .logo span {
            color: var(--accent-color);
        }

        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--text-main);
        }

        .container {
            max-width: 1200px;
            margin: 32px auto;
            padding: 0 24px;
        }

        .profile-header {
            margin-bottom: 32px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        .profile-name {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .profile-subtitle {
            font-size: 14px;
            color: var(--text-muted);
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 24px;
            color: var(--text-muted);
            border-left: 3px solid var(--accent-color);
            padding-left: 12px;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }

        .video-card {
            background: var(--card-bg);
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .video-card:hover {
            transform: translateY(-2px);
            border-color: #3a3f4b;
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background: #000;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .video-info {
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .video-meta {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .video-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: 0.5px;
        }

        .video-actress {
            font-size: 12px;
            color: var(--text-muted);
        }

        .video-badge {
            font-size: 10px;
            text-transform: uppercase;
            background: rgba(229, 9, 20, 0.15);
            color: var(--accent-color);
            padding: 3px 8px;
            border-radius: 3px;
            font-weight: 700;
            letter-spacing: 0.5px;
            height: fit-content;
        }
    </style>
</head>
<body>

    <header class="navbar">
        <a href="../" class="logo">Jav<span>Stream</span></a>
        <a href="../" class="back-link">&larr; Return to Home</a>
    </header>

    <main class="container">
        <div class="profile-header">
            <h1 class="profile-name">Minamisawa Umika</h1>
            <p class="profile-subtitle">Actress Archive &bull; Filmography Catalog</p>
        </div>

        <h2 class="section-title">Featured Releases</h2>
        
        <div class="video-grid">
            <!-- Kartu Video Milik Minamisawa Umika -->
            <div class="video-card">
                <div class="video-container">
                    <iframe src="https://luluvido.com/e/13jr1kyhz6m7" allowfullscreen></iframe>
                </div>
                <div class="video-info">
                    <div class="video-meta">
                        <div class="video-title">JUR-655</div>
                        <div class="video-actress">Minamisawa Umika</div>
                    </div>
                    <span class="video-badge">HD</span>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
