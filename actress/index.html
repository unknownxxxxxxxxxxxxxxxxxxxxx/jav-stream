<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Title & SEO Meta Tags -->
    <title>Actress Directory - JavStream HD</title>
    <meta name="description" content="Explore actress archives and associated high quality JAV streaming releases on JavStream HD.">
    <meta name="keywords" content="jav actress, javstream, javstreamhd, streaming jav actress, Aoi Ibuki, Minamisawa Umika">
    
    <!-- Google Site Verification -->
    <meta name="google-site-verification" content="WKsgCWA9Sjz-bw_bkkrmzkVkt-CaIXmNXbR2FbcE-3M" />

    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #15161c;
            --accent-color: #e50914;
            --text-main: #ffffff;
            --text-muted: #8c8f96;
            --border-color: #22252a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            padding: 14px 24px;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 20px;
            font-weight: 800;
            color: var(--text-main);
            text-decoration: none;
            letter-spacing: 0.5px;
        }

        .logo span {
            color: var(--accent-color);
        }

        .container {
            max-width: 1200px;
            margin: 32px auto;
            padding: 0 24px;
            flex: 1;
            width: 100%;
        }

        .profile-header {
            margin-bottom: 32px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        .profile-name {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
        }

        .alphabet-heading {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-main);
            border-left: 3px solid var(--accent-color);
            padding-left: 12px;
            margin-bottom: 16px;
            letter-spacing: 1px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .actress-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 20px;
            text-decoration: none;
            color: var(--text-main);
            transition: transform 0.2s ease, border-color 0.2s ease;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .actress-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent-color);
        }

        .actress-card-name {
            font-size: 16px;
            font-weight: 600;
        }

        .actress-card-count {
            font-size: 12px;
            color: var(--text-muted);
        }

        .site-footer {
            text-align: center;
            padding: 30px 24px;
            border-top: 1px solid var(--border-color);
            margin-top: auto;
            color: var(--text-muted);
            font-size: 13px;
        }
    </style>
</head>
<body>

    <header class="navbar">
        <a href="../" class="logo">Jav<span>Stream</span></a>
    </header>

    <main class="container">
        <div class="profile-header">
            <h1 class="profile-name">Actress Directory</h1>
        </div>

        <!-- Huruf A -->
        <div class="alphabet-section">
            <div class="alphabet-heading">A</div>
            <div class="grid">
                <a href="aoi-ibuki/" class="actress-card">
                    <div class="actress-card-name">Aoi Ibuki</div>
                    <div class="actress-card-count">5 Releases</div>
                </a>
            </div>
        </div>

        <!-- Huruf M -->
        <div class="alphabet-section">
            <div class="alphabet-heading">M</div>
            <div class="grid">
                <a href="minamisawa-umika/" class="actress-card">
                    <div class="actress-card-name">Minamisawa Umika</div>
                    <div class="actress-card-count">3 Releases</div>
                </a>
            </div>
        </div>

    </main>

    <footer class="site-footer">
        <p>&copy; 2026 JavStream HD. All rights reserved.</p>
    </footer>

</body>
</html>
