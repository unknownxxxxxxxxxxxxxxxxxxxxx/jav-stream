<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actress Directory - JavStream</title>
    <style>
        :root {
            --bg-color: #0f1015;
            --card-bg: #181920;
            --accent-color: #e50914;
            --text-main: #ffffff;
            --text-muted: #a0a0a5;
            --border-color: #2a2b36;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            padding: 12px 20px;
            border-bottom: 1px solid var(--border-color);
        }
        .logo {
            font-size: 20px;
            font-weight: 800;
            color: var(--text-main);
            text-decoration: none;
        }
        .logo span { color: var(--accent-color); }
        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
            text-align: center;
        }
        .title {
            font-size: 22px;
            margin-bottom: 15px;
            color: var(--text-main);
        }
        p { color: var(--text-muted); margin-bottom: 25px; font-size: 14px; }
        .back-btn {
            display: inline-block;
            background: var(--card-bg);
            color: var(--text-main);
            padding: 10px 20px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.2s;
        }
        .back-btn:hover {
            background: rgba(229, 9, 20, 0.15);
            color: var(--accent-color);
            border-color: var(--accent-color);
        }
    </style>
</head>
<body>

    <header class="navbar">
        <a href="../" class="logo">Jav<span>Stream</span></a>
    </header>

    <main class="container">
        <h1 class="title">✨ Direktori Aktris</h1>
        <p>Halaman khusus arsip aktris sedang dipersiapkan di subfolder ini.</p>
        <div>
            <a href="../" class="back-btn">← Kembali ke Beranda</a>
        </div>
    </main>

</body>
</html>
