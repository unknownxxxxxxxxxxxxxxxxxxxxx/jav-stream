<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Title & SEO Meta Tags -->
    <title>Actress Directory - JavStream HD</title>
    <meta name="description" content="Explore actress archives and associated high quality JAV streaming releases on JavStream HD.">
    <meta name="keywords" content="jav actress directory, list of jav actresses, streaming jav actress, javstream, javstreamhd">
    
    <!-- Google Site Verification -->
    <meta name="google-site-verification" content="WKsgCWA9Sjz-bw_bkkrmzkVkt-CaIXmNXbR2FbcE-3M" />
</head>

    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #15161c;
            --accent-color: #e50914;
            --text-main: #ffffff;
            --text-muted: #8c8f96;
            --border-color: #22252a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            padding: 14px 24px;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 20px;
            font-weight: 800;
            color: var(--text-main);
            text-decoration: none;
            letter-spacing: 0.5px;
        }

        .logo span {
            color: var(--accent-color);
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 6px 12px;
            width: 180px;
            transition: width 0.3s ease, border-color 0.2s;
        }

        @media (min-width: 768px) {
            .search-box {
                width: 240px;
            }
        }

        .search-box:focus-within {
            border-color: var(--accent-color);
        }

        .search-input {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 13px;
            outline: none;
            width: 100%;
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .container {
            max-width: 1200px;
            margin: 32px auto;
            padding: 0 24px;
            flex: 1;
            width: 100%;
        }

        .profile-header {
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        @media (min-width: 768px) {
            .profile-header {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
        }

        .profile-name {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
        }

        .az-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 28px;
            background: var(--card-bg);
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            justify-content: center;
        }

        .az-btn {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }

        .az-btn:hover, .az-btn.active {
            background: var(--accent-color);
            color: var(--text-main);
            border-color: var(--accent-color);
        }

        .alphabet-section {
            margin-bottom: 32px;
        }

        .alphabet-heading {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-main);
            border-left: 3px solid var(--accent-color);
            padding-left: 12px;
            margin-bottom: 16px;
            letter-spacing: 1px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .actress-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 20px;
            text-decoration: none;
            color: var(--text-main);
            transition: transform 0.2s ease, border-color 0.2s ease;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .actress-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent-color);
        }

        .actress-card-name {
            font-size: 16px;
            font-weight: 600;
        }

        .actress-card-count {
            font-size: 12px;
            color: var(--text-muted);
        }

        .site-footer {
            text-align: center;
            padding: 30px 24px;
            border-top: 1px solid var(--border-color);
            margin-top: auto;
            color: var(--text-muted);
            font-size: 13px;
        }
    </style>
</head>
<body>

    <header class="navbar">
        <a href="../" class="logo">Jav<span>Stream</span></a>
        <div class="nav-right">
            <div class="search-box">
                <input type="text" class="search-input" placeholder="Search actress..." id="actressSearchInput" oninput="filterActresses()">
            </div>
        </div>
    </header>

    <main class="container">
        <div class="profile-header">
            <h1 class="profile-name">Actress Directory</h1>
        </div>

        <!-- Tombol Filter Abjad A-Z -->
        <div class="az-bar" id="azBar">
            <button class="az-btn active" onclick="filterByLetter('ALL', this)">ALL</button>
            <button class="az-btn" onclick="filterByLetter('A', this)">A</button>
            <button class="az-btn" onclick="filterByLetter('B', this)">B</button>
            <button class="az-btn" onclick="filterByLetter('C', this)">C</button>
            <button class="az-btn" onclick="filterByLetter('D', this)">D</button>
            <button class="az-btn" onclick="filterByLetter('E', this)">E</button>
            <button class="az-btn" onclick="filterByLetter('F', this)">F</button>
            <button class="az-btn" onclick="filterByLetter('G', this)">G</button>
            <button class="az-btn" onclick="filterByLetter('H', this)">H</button>
            <button class="az-btn" onclick="filterByLetter('I', this)">I</button>
            <button class="az-btn" onclick="filterByLetter('J', this)">J</button>
            <button class="az-btn" onclick="filterByLetter('K', this)">K</button>
            <button class="az-btn" onclick="filterByLetter('L', this)">L</button>
            <button class="az-btn" onclick="filterByLetter('M', this)">M</button>
            <button class="az-btn" onclick="filterByLetter('N', this)">N</button>
            <button class="az-btn" onclick="filterByLetter('O', this)">O</button>
            <button class="az-btn" onclick="filterByLetter('P', this)">P</button>
            <button class="az-btn" onclick="filterByLetter('Q', this)">Q</button>
            <button class="az-btn" onclick="filterByLetter('R', this)">R</button>
            <button class="az-btn" onclick="filterByLetter('S', this)">S</button>
            <button class="az-btn" onclick="filterByLetter('T', this)">T</button>
            <button class="az-btn" onclick="filterByLetter('U', this)">U</button>
            <button class="az-btn" onclick="filterByLetter('V', this)">V</button>
            <button class="az-btn" onclick="filterByLetter('W', this)">W</button>
            <button class="az-btn" onclick="filterByLetter('X', this)">X</button>
            <button class="az-btn" onclick="filterByLetter('Y', this)">Y</button>
            <button class="az-btn" onclick="filterByLetter('Z', this)">Z</button>
        </div>

        <div id="alphabetGroupsContainer">
            <!-- KONTEN HTML STATIS UTAMA (Langsung terbaca Google) -->
            
            <!-- Huruf A -->
            <div class="alphabet-section" data-letter="A">
                <div class="alphabet-heading">A</div>
                <div class="grid">

                    <!-- Aoi Ibuki -->
                    <a href="aoi-ibuki/" class="actress-card" data-name="aoi ibuki">
                        <div class="actress-card-name">Aoi Ibuki</div>
                        <div class="actress-card-count">5 Releases</div>
                    </a>
                </div>
            </div>

            <!-- Huruf M -->
            <div class="alphabet-section" data-letter="M">
                <div class="alphabet-heading">M</div>
                <div class="grid">

                    <!-- Minamisawa Umika -->
                    <a href="minamisawa-umika/" class="actress-card" data-name="minamisawa umika">
                        <div class="actress-card-name">Minamisawa Umika</div>
                        <div class="actress-card-count">3 Releases</div>
                    </a>
                </div>
            </div>

            <!-- Huruf T -->
            <div class="alphabet-section" data-letter="T">
                <div class="alphabet-heading">T</div>
                <div class="grid">

                    <!-- Takara -->
                    <a href="takara/" class="actress-card" data-name="takara">
                        <div class="actress-card-name">Takara</div>
                        <div class="actress-card-count">1 Releases</div>
                    </a>
                </div>
            </div>

        </div>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 JavStream HD. All rights reserved.</p>
    </footer>

    <script>
        // Fungsi Pencarian Interaktif untuk Direktori Aktris
        function filterActresses() {
            let query = document.getElementById('actressSearchInput').value.toLowerCase().trim();
            let cards = document.querySelectorAll('.actress-card');
            let sections = document.querySelectorAll('.alphabet-section');

            cards.forEach(card => {
                let name = card.getAttribute('data-name');
                if (name.includes(query)) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });

            // Sembunyikan section huruf jika semua card di dalamnya tersembunyi
            sections.forEach(section => {
                let visibleCards = section.querySelectorAll('.actress-card[style*="display: flex"], .actress-card:not([style*="display: none"])');
                if (visibleCards.length === 0) {
                    section.style.display = 'none';
                } else {
                    section.style.display = 'block';
                }
            });
        }

        // Fungsi Filter Abjad A-Z
        function filterByLetter(letter, btnElement) {
            let buttons = document.querySelectorAll('.az-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            let sections = document.querySelectorAll('.alphabet-section');
            sections.forEach(section => {
                let secLetter = section.getAttribute('data-letter');
                if (letter === 'ALL' || secLetter === letter) {
                    section.style.display = 'block';
                } else {
                    section.style.display = 'none';
                }
            });
        }
    </script>

</body>
</html>
