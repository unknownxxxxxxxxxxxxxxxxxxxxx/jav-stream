<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aoi Ibuki - JAV Streaming Archive & Videos | JavStream HD</title>
    <meta name="description" content="Watch high quality JAV streaming videos starring Aoi Ibuki online on JavStream HD.">
    <style>
        :root { --bg-color: #0b0c10; --card-bg: #15161c; --accent-color: #e50914; --text-main: #ffffff; --text-muted: #8c8f96; --border-color: #22252a; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-main); line-height: 1.5; display: flex; flex-direction: column; min-height: 100vh; }
        .navbar { display: flex; justify-content: space-between; align-items: center; background-color: var(--card-bg); padding: 14px 24px; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 20px; font-weight: 800; color: var(--text-main); text-decoration: none; }
        .logo span { color: var(--accent-color); }
        .container { max-width: 1200px; margin: 32px auto; padding: 0 24px; flex: 1; width: 100%; }
        .profile-header { margin-bottom: 24px; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; }
        .profile-name { font-size: 24px; font-weight: 700; color: var(--text-main); }
        .video-count-badge { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; }
        .video-card { background: var(--card-bg); border-radius: 6px; overflow: hidden; border: 1px solid var(--border-color); }
        .video-container { position: relative; width: 100%; padding-top: 56.25%; background: #000; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        .video-info { padding: 14px 16px; display: flex; justify-content: space-between; align-items: flex-start; }
        .video-title { font-size: 14px; font-weight: 600; color: var(--text-main); }
        .video-actress { font-size: 12px; color: var(--text-muted); }
        .video-badge { font-size: 10px; background: rgba(229, 9, 20, 0.15); color: var(--accent-color); padding: 3px 8px; border-radius: 3px; font-weight: 700; }
        .site-footer { text-align: center; padding: 30px 24px; border-top: 1px solid var(--border-color); margin-top: auto; color: var(--text-muted); font-size: 13px; }
    </style>
</head>
<body>
    <header class="navbar"><a href="../../" class="logo">Jav<span>Stream</span></a></header>
    <main class="container">
        <div class="profile-header">
            <h1 class="profile-name">Aoi Ibuki</h1>
            <div class="video-count-badge">Showing 5 Videos</div>
        </div>
        <div class="video-grid">
            <div class="video-card">
                <div class="video-container"><iframe src="https://luluvido.com/e/ehxd29ifwn0h" allowfullscreen loading="lazy"></iframe></div>
                <div class="video-info">
                    <div><h3 class="video-title">MIDV-073</h3><div class="video-actress">Aoi Ibuki</div></div>
                    <span class="video-badge">HD</span>
                </div>
            </div>
            <!-- Masukkan video Aoi Ibuki lainnya di bawah dengan urutan terbaru di atas -->
        </div>
    </main>
    <footer class="site-footer"><p>&copy; 2026 JavStream HD. All rights reserved.</p></footer>
</body>
</html>
